# SonarQube analysis settings for the Subsidi Tepat frontend.
#
# forge passes -Dsonar.projectKey / -Dsonar.sources / -Dsonar.host.url on the command line and
# those take precedence — in particular sonar.sources is forced to `.`. This file supplies what
# forge does not: exclusions, the source/test split, and the coverage report.

sonar.projectName=Pertamina Subsidi Tepat — Frontend
sonar.sourceEncoding=UTF-8

# Never analyse dependencies, build output, the UX mockup scaffold, or reports.
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  coverage/**,\
  playwright-report/**,\
  test-results/**,\
  openspec/changes/*/ux-preview/**,\
  openspec/forge/**,\
  next-env.d.ts

# Sources and tests share one root, so partition them by inclusion rather than by directory —
# declaring sonar.tests=src while sonar.sources=. would index the same files twice.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.spec.ts

# Coverage produced by `npm test -- --coverage` (Vitest v8 provider).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPath=tsconfig.json
