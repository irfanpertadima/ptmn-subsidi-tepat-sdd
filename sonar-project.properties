# SonarQube analysis settings for the Subsidi Tepat frontend.
#
# forge passes -Dsonar.projectKey / -Dsonar.sources / -Dsonar.host.url on the command line
# (those take precedence). This file supplies what forge does not: what to leave out, and where
# the tests and TypeScript config live.

sonar.projectName=Pertamina Subsidi Tepat — Frontend
sonar.sourceEncoding=UTF-8

# Never analyse dependencies, build output, the UX mockup scaffold, or reports.
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  coverage/**,\
  playwright-report/**,\
  test-results/**,\
  openspec/changes/*/ux-preview/**,\
  openspec/forge/**,\
  next-env.d.ts

sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.spec.ts
sonar.typescript.tsconfigPath=tsconfig.json
